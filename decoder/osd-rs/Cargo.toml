[package]
name = "osd174"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Bit-packed drop-in for WSJT-X's osd174_91 (ordered-statistics decoder of the (174,91) LDPC code)"

[lib]
crate-type = ["staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1
