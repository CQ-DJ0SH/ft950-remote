<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Station map</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
  :root{--bg:#0c1115; --panel:#121a20; --text:#dbe4ea; --dim:#8a99a5; --dx:#3fe0d0; --home:#ffb23e; --edge:#26323b}
  html,body{margin:0; height:100%; background:var(--bg); color:var(--text);
    font:13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif}
  #map{position:absolute; inset:0}
  .info{position:absolute; z-index:1000; top:10px; left:54px; right:10px; max-width:460px;
    background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:8px 12px;
    box-shadow:0 4px 16px rgba(0,0,0,.4)}
  .info b{font-size:16px; letter-spacing:.04em}
  .info .dim{color:var(--dim)}
  .info .dx{color:var(--dx)} .info .home{color:var(--home)}
  .err{color:#ff6b5e}
</style>
</head>
<body>
<div id="map"></div>
<div class="info" id="info">Loading …</div>
<script src="vendor/leaflet/leaflet.js"></script>
<script>
// Session map: the station at its locator (or its DXCC entity centre), your
// own locator, the great-circle path, distance and short-path bearing.
const q = new URLSearchParams(location.search);
const call = (q.get("call") || "").toUpperCase();
const grid = (q.get("grid") || "").trim();
const myGrid = (q.get("my") || "").trim();
const info = document.getElementById("info");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
document.title = (call || "Station") + " · map";

function gridToLatLon(g) {                     // centre of a 4- or 6-character Maidenhead square
  g = g.toUpperCase();
  if (!/^[A-R]{2}\d{2}([A-X]{2})?$/.test(g)) return null;
  let lon = (g.charCodeAt(0) - 65) * 20 - 180 + Number(g[2]) * 2;
  let lat = (g.charCodeAt(1) - 65) * 10 - 90 + Number(g[3]);
  if (g.length === 6) { lon += (g.charCodeAt(4) - 65) * 5 / 60 + 2.5 / 60; lat += (g.charCodeAt(5) - 65) * 2.5 / 60 + 1.25 / 60; }
  else { lon += 1; lat += 0.5; }
  return [lat, lon];
}
const rad = (d) => d * Math.PI / 180, deg = (r) => r * 180 / Math.PI;
function distBearing(a, b) {
  const [f1, l1, f2, l2] = [rad(a[0]), rad(a[1]), rad(b[0]), rad(b[1])];
  const d = 2 * Math.asin(Math.sqrt(Math.sin((f2 - f1) / 2) ** 2 + Math.cos(f1) * Math.cos(f2) * Math.sin((l2 - l1) / 2) ** 2));
  const y = Math.sin(l2 - l1) * Math.cos(f2);
  const x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(l2 - l1);
  return { km: d * 6371.0, brg: (deg(Math.atan2(y, x)) + 360) % 360, d };
}
function greatCircle(a, b, n = 128) {           // points along the short path, longitudes unwrapped
  const { d } = distBearing(a, b);
  if (d < 1e-6) return [a, b];
  const [f1, l1, f2, l2] = [rad(a[0]), rad(a[1]), rad(b[0]), rad(b[1])];
  const pts = [];
  let prev = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n, A = Math.sin((1 - t) * d) / Math.sin(d), B = Math.sin(t * d) / Math.sin(d);
    const x = A * Math.cos(f1) * Math.cos(l1) + B * Math.cos(f2) * Math.cos(l2);
    const y = A * Math.cos(f1) * Math.sin(l1) + B * Math.cos(f2) * Math.sin(l2);
    const z = A * Math.sin(f1) + B * Math.sin(f2);
    let lon = deg(Math.atan2(y, x));
    if (prev !== null) lon += 360 * Math.round((prev - lon) / 360);   // no jump at ±180°
    prev = lon;
    pts.push([deg(Math.atan2(z, Math.hypot(x, y))), lon]);
  }
  return pts;
}

const map = L.map("map", { worldCopyJump: true, zoomControl: true }).setView([30, 0], 2);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
}).addTo(map);

(async () => {
  let dx = grid ? gridToLatLon(grid) : null, where = grid ? `Locator ${esc(grid.toUpperCase())}` : "";
  if (!dx && call) {
    try {
      const r = await fetch("/api/dxcc/locate?call=" + encodeURIComponent(call));
      if (r.ok) { const p = await r.json(); dx = [p.lat, p.lon]; where = `no locator · centre of ${esc(p.entity)}`; }
    } catch { /* below */ }
  }
  if (!dx) { info.innerHTML = `<b>${esc(call)}</b> <span class="err">— no locator and no DXCC position</span>`; return; }
  const home = myGrid ? gridToLatLon(myGrid) : null;
  L.circleMarker(dx, { radius: 8, color: "#0b6f66", weight: 2, fillColor: "#3fe0d0", fillOpacity: .9 })
    .addTo(map).bindTooltip(call, { permanent: true, direction: "right", offset: [8, 0] });
  let line = `<b class="dx">${esc(call)}</b> <span class="dim">${where}</span>`;
  if (home) {
    const pts = greatCircle(home, dx);
    // dashed path with a light halo: readable on sea and land alike
    L.polyline(pts, { color: "#ffffff", weight: 6, opacity: .75, interactive: false }).addTo(map);
    L.polyline(pts, { color: "#c2185b", weight: 3, opacity: 1, dashArray: "10 8", lineCap: "butt", interactive: false }).addTo(map);
    L.circleMarker(home, { radius: 6, color: "#8a5a00", weight: 2, fillColor: "#ffb23e", fillOpacity: .9 })
      .addTo(map).bindTooltip("Home " + myGrid.toUpperCase(), { direction: "right", offset: [8, 0] });
    const { km, brg } = distBearing(home, dx);
    line += `<br><span class="home">from ${esc(myGrid.toUpperCase())}</span> · <b>${Math.round(km).toLocaleString("en")} km</b>` +
      ` · bearing <b>${Math.round(brg)}°</b> <span class="dim">(long path ${Math.round((brg + 180) % 360)}°)</span>`;
    map.fitBounds(L.latLngBounds(pts).pad(0.25), { maxZoom: 7 });
  } else {
    map.setView(dx, grid ? 6 : 4);
  }
  info.innerHTML = line;
})();
</script>
</body>
</html>
